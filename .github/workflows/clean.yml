name: Branch Deleted
on:
  delete:
  pull_request:
    types: [closed]

permissions:
  contents: write
  packages: write

env:
  TAG_NAME: ${{ github.event.ref || github.ref }}

jobs:
  delete:
    if: (github.event_name == 'delete' && github.event.ref_type == 'branch') || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: qubership-redis-operator
            file: redis-operator/Dockerfile
            context: redis-operator
          - name: qubership-redis-monitoring-agent
            file: redis-monitoring-agent/Dockerfile
            context: redis-monitoring-agent
          - name: qubership-redis-tests
            file: redis-tests/Dockerfile
            context: redis-tests
          - name: qubership-redis-transfer
            file: docker-transfer/Dockerfile
            context: ""
          - name: qubership-docker-redis-7
            file: docker-redis/7/Dockerfile
            context: docker-redis/7
          - name: qubership-docker-redis-8
            file: docker-redis/8/Dockerfile
            context: docker-redis/8
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${GITHUB_ACTOR}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Prepare Tag
        run: echo "TAG_NAME=$(echo ${TAG_NAME} | sed 's@refs/heads/@@;s@/@_@g')" >> $GITHUB_ENV
      - name: Get package IDs for delete
        id: get-ids-for-delete
        uses: Netcracker/get-package-ids@v0.0.1
        with:
          component-name: ${{ matrix.component.name }}
          component-tag: ${{ env.TAG_NAME }}
          access-token: ${{secrets.GITHUB_TOKEN}}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.component.name }}
          package-type: 'container'
          package-version-ids: ${{ steps.get-ids-for-delete.outputs.ids-for-delete }}
        if: ${{ steps.get-ids-for-delete.outputs.ids-for-delete != '' }}
      - name: Delete head branch
        if: github.event_name == 'pull_request' && matrix.component.name == 'qubership-redis-operator' && contains(github.event.pull_request.labels.*.name, 'delete-branch')
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ github.head_ref }}"
