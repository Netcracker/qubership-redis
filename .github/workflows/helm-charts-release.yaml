---

name: Helm Charts Release
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version'
        required: true
        type: string
permissions:
  contents: read

run-name: ${{ github.repository }} Release ${{ github.event.inputs.release }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-charts-release:
    name: Helm Charts Release
    permissions:
      contents: write
      packages: write
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: netcracker/qubership-workflow-hub/.github/workflows/re-infra-helm-release.yaml@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
    with:
      release: ${{ inputs.release }}
      docker-config-file: ".github/docker-build-config.json"
      helm-charts-config-file: ".github/helm-charts-release-config.yaml"
      max-parallel: 4
