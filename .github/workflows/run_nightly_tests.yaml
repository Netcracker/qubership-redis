name: Run Nightly Redis Pipeline

permissions:
  contents: read
  packages: read
  actions: read

on:
  schedule:
    - cron: '0 1 * * *'

jobs:
  Nightly-Redis-Pipeline:
    uses: Netcracker/qubership-test-pipelines/.github/workflows/redis.yaml@d5786358e2e534552aa82fea2e419fe1e4a88df7  # v1.18.0
    with:
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: 'd5786358e2e534552aa82fea2e419fe1e4a88df7' # v1.18.0 renovate: depName=Netcracker/qubership-test-pipelines
      scope: 'nightly'
