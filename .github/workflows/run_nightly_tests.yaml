name: Run Nightly Redis Pipeline

permissions:
  contents: read
  packages: read
  actions: read

on:
  schedule:
    - cron: '0 1 * * *'

jobs:
  Nightly-Redis-Pipeline:
    uses: Netcracker/qubership-test-pipelines/.github/workflows/redis.yaml@51e6fa605dd96153f66ed87e676f99ac8fdab094 # v1.18.1
    with:
      service_branch: '${{ github.head_ref || github.ref_name }}'
      pipeline_branch: '51e6fa605dd96153f66ed87e676f99ac8fdab094' # v1.18.1 renovate: depName=Netcracker/qubership-test-pipelines
      scope: 'nightly'
