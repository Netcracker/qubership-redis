{{- if and .Values.dbaas.createIngress (include "fromValuesThenEnvElseDefault" (dict "dotVar" .Values.dbaas.install "envVar" .Values.DBAAS_ENABLED "default" true )) .Values.CLOUD_PUBLIC_HOST (contains "gateway-api-default" (include "redis.gatewaySystemType" .)) }}
{{- if and (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") (eq (.Values.PAAS_PLATFORM | default "KUBERNETES") "KUBERNETES") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    {{- include "redis.defaultLabels" . | nindent 4 }}
  name: {{ printf "%s-dbaas-adapter-swagger" .Release.Namespace }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "redis.gatewayApiName" . | quote }}
    namespace: {{ include "redis.gatewayApiNamespace" . | quote }}
  hostnames:
  - {{ printf "redis-swagger.%s" .Values.CLOUD_PUBLIC_HOST | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: dbaas-redis-adapter
      port: 8080
      weight: 1
{{- end }}
{{- end }}
